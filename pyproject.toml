[tool.ruff]
line-length = 110

[tool.ruff.lint]
# S110 и BLE001 отключены осознанно: в проекте несколько мест, где
# мы намеренно ловим любые исключения — например, при удалении
# уже удалённого сообщения Telegram или при попытке выставить
# опциональные флаги torch. Логировать эти случаи шумно и бесполезно.
ignore = ["S110", "BLE001"]

[tool.ruff.lint.per-file-ignores]
# parser_v5.py — одноразовый скрипт для парсинга, не часть бота
"parser_v5.py" = ["DTZ", "F541"]